appId: com.nameforge.app
productName: NameForge
copyright: Copyright © 2024 NameForge

directories:
  buildResources: assets
  output: release

# ASAR-1: Apply Electron fuses after packing (hardens executable)
afterPack: scripts/afterPack.js

files:
  - dist/**/*
  - main.js
  - preload.js
  - package.json
  # Explicit list — prevents accidental inclusion of future files in src/utils/
  - src/utils/openscadRunner.js
  - src/utils/openscadUpdater.js
  - src/utils/bambu3mf.js

extraResources:
  - from: resources/openscad
    to: openscad
    filter:
      - "**/*"
  - from: resources/scad
    to: scad
    filter:
      - "**/*"
  - from: resources/fonts
    to: fonts
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: assets/icon.ico
  # SIGN-1: Code signing — requires EV certificate (DigiCert/Sectigo ~$300/yr)
  # To enable: set env vars CSC_LINK (path to .pfx) + CSC_KEY_PASSWORD (pfx password)
  # electron-builder picks them up automatically when present.
  # Without cert: Windows SmartScreen warns "Unknown publisher" on first run.
  signingHashAlgorithms:
    - sha256
  # publisherName: "NameForge"  # uncomment when cert acquired

mac:
  target:
    - target: dmg
    - target: zip
  icon: assets/icon.icns
  category: public.app-category.productivity

linux:
  target:
    - target: AppImage
    - target: deb
  icon: assets/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false  # DLL-1: force Program Files — not user-writable
  perMachine: true                           # installs to C:\Program Files, requires admin
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

# publish:
#   provider: github
#   owner: YOUR_GITHUB_USERNAME   ← remplacer avant de publier
#   repo: nameforge
